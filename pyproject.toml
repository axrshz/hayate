[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hayate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.10.0,<2.11",
    "transformers>=4.51.0,<6",
    "safetensors",
    "huggingface_hub",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hayate*"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
